services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-prediction-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_prediction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: stock-prediction-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-prediction-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stock_prediction
      API_ENV: ${API_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-32chars-min}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Comma-separated list; the frontend origin must be present when the
      # frontend is served from a different host than the API.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RELOAD: ${RELOAD:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # One-shot: migrations run on backend boot, so this only populates data.
  # Google Trends is rate limited, hence the separate profile.
  bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-prediction-bootstrap
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stock_prediction
      API_ENV: development
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-32chars-min}
      DEFAULT_MARKET_SYMBOL: ${DEFAULT_MARKET_SYMBOL:-^NSEI}
      DEFAULT_START_DATE: ${DEFAULT_START_DATE:-2024-01-01}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      SKIP_MIGRATIONS: "1"
    command: ["python", "scripts/bootstrap_demo.py"]
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["bootstrap"]
    restart: "no"
    networks:
      - app-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-prediction-celery-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stock_prediction
      API_ENV: ${API_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-32chars-min}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    command: celery -A app.workers.celery_app worker --loglevel=info --queues=ingestion,ml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-prediction-celery-beat
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stock_prediction
      API_ENV: ${API_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-32chars-min}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: stock-prediction-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - mlflow_data:/mlflow
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri file:/mlflow
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-prediction-frontend
    ports:
      - "5173:5173"
    environment:
      # The browser calls the API directly, so this must be a URL reachable
      # from the browser, not the compose service name.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  mlflow_data:

networks:
  app-network:
    driver: bridge